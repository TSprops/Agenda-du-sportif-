# À chaque modification : tests automatiques, puis mise en ligne sur Firebase (site, règles, index et fonctions serveur).
# La mise en ligne ne se fait que si les tests passent.
name: Tests et mise en ligne Firebase

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: firebase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm ci --prefix functions
      - run: npm test

  deploy:
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Clé Firebase absente
        if: env.FIREBASE_SA == ''
        run: echo "::warning::Ajoute le secret FIREBASE_SERVICE_ACCOUNT pour publier sur Firebase."
      - name: Mise en ligne (site, règles, index et fonctions serveur)
        if: env.FIREBASE_SA != ''
        run: |
          npm ci --prefix functions
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@15 deploy --only hosting,firestore,functions --project agenda-du-sportif --non-interactive --force
